<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM Games</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            dark: {
              base: '#050508',
              surface: '#0d0d12',
              card: '#14141d',
              border: '#1e1e2d'
            },
            accent: {
              cyan: '#00f2fe',
              purple: '#9d4edd',
              magenta: '#f72585'
            }
          },
          animation: {
            'glow-pulse': 'glowPulse 4s infinite alternate',
            'float-subtle': 'floatSubtle 6s ease-in-out infinite',
          },
          keyframes: {
            glowPulse: {
              '0%': { filter: 'drop-shadow(0 0 15px rgba(0, 242, 254, 0.25))' },
              '100%': { filter: 'drop-shadow(0 0 30px rgba(157, 78, 221, 0.45))' }
            },
            floatSubtle: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Strict Pure Dark Theme setup */
    body {
      cursor: none;
      background-color: #050508;
      color: #e4e4e7;
      overflow-x: hidden;
    }

    /* Custom Interactive Trailing Cursor */
    #cursor-dot {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: #00f2fe;
      border-radius: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.15s ease, height 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 0 12px #00f2fe;
    }

    #cursor-ring {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(157, 78, 221, 0.5);
      border-radius: 50%;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease-out, width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    /* Hover State for Interactive Elements */
    .cursor-hover #cursor-dot {
      width: 12px;
      height: 12px;
      background-color: #f72585;
      box-shadow: 0 0 16px #f72585;
    }
    .cursor-hover #cursor-ring {
      width: 52px;
      height: 52px;
      border-color: rgba(247, 37, 133, 0.7);
      background-color: rgba(247, 37, 133, 0.06);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050508;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e1e2d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9d4edd;
    }

    /* Dark Glass Panel */
    .dark-glass {
      background: rgba(13, 13, 18, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Search Box Focus Glow */
    .search-container {
      background: rgba(20, 20, 29, 0.85);
      border: 1px solid rgba(30, 30, 45, 0.8);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .search-container:focus-within {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.15), 0 0 2px rgba(0, 242, 254, 0.5);
    }

    /* Tab Switch Animations */
    .page-view {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .page-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    /* Shift Lock Crosshair Overlay */
    #shift-lock-crosshair {
      pointer-events: none;
      display: none;
    }
    #shift-lock-crosshair.active {
      display: flex;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none antialiased bg-dark-base text-gray-200">

  <!-- Custom Cursor Elements -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Dynamic Interactive Moving Dark Background Canvas -->
  <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Top Navigation Header -->
  <header class="relative z-50 w-full px-6 py-4 flex items-center justify-between dark-glass border-b border-dark-border">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-purple-900 via-dark-card to-cyan-900 border border-cyan-500/30 flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-gamepad text-cyan-400 text-sm"></i>
      </div>
      <span class="text-xl font-black tracking-wider text-white">
        CM <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">GAMES</span>
      </span>
    </div>

    <!-- Strictly 2 Navigation Tabs: Home and Games -->
    <nav class="flex items-center space-x-2 bg-dark-card/80 p-1.5 rounded-xl border border-dark-border">
      <button 
        id="nav-home" 
        onclick="switchTab('home')" 
        class="px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-sm"
      >
        <i class="fa-solid fa-house mr-2 text-xs"></i>Home
      </button>
      <button 
        id="nav-games" 
        onclick="switchTab('games')" 
        class="px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white hover:bg-white/5"
      >
        <i class="fa-solid fa-gamepad mr-2 text-xs"></i>Games
      </button>
    </nav>
  </header>

  <!-- Main Page Container -->
  <div class="relative z-10 flex-grow flex flex-col w-full">
    
    <!-- PAGE 1: HOME (Strictly Minimalist: Title + Browser Search Bar Only) -->
    <section id="page-home" class="page-view flex-grow flex flex-col items-center justify-center px-4 sm:px-6 max-w-4xl mx-auto w-full text-center py-12">
      
      <!-- Minimalist CM Games Title -->
      <h1 class="text-6xl sm:text-8xl font-black tracking-tight mb-10 animate-glow-pulse">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
          CM GAMES
        </span>
      </h1>

      <!-- Browser Search Engine Component -->
      <div class="w-full max-w-2xl relative">
        <form onsubmit="handleBrowserSearch(event)" class="search-container rounded-2xl p-2.5 flex items-center shadow-2xl relative">
          
          <!-- Search Engine Selector Dropdown -->
          <div class="relative group border-r border-dark-border pr-2 mr-2">
            <button 
              type="button" 
              id="engine-btn" 
              onclick="toggleEngineMenu()" 
              class="flex items-center space-x-2 px-3 py-2 rounded-xl bg-dark-base/50 hover:bg-dark-base text-xs font-medium text-gray-300 transition-colors"
            >
              <i id="engine-icon" class="fa-brands fa-google text-cyan-400 text-base"></i>
              <span id="engine-name" class="hidden sm:inline">Google</span>
              <i class="fa-solid fa-chevron-down text-[10px] text-gray-500"></i>
            </button>

            <!-- Dropdown Options -->
            <div id="engine-menu" class="hidden absolute left-0 top-full mt-2 w-44 rounded-xl dark-glass border border-dark-border shadow-2xl p-1.5 z-50 text-left">
              <button type="button" onclick="selectEngine('google')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-white/5 hover:text-cyan-400 transition-colors">
                <i class="fa-brands fa-google w-4 text-cyan-400"></i>
                <span>Google</span>
              </button>
              <button type="button" onclick="selectEngine('duckduckgo')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-white/5 hover:text-cyan-400 transition-colors">
                <i class="fa-solid fa-shield-halved w-4 text-orange-400"></i>
                <span>DuckDuckGo</span>
              </button>
              <button type="button" onclick="selectEngine('bing')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-white/5 hover:text-cyan-400 transition-colors">
                <i class="fa-brands fa-microsoft w-4 text-blue-400"></i>
                <span>Bing</span>
              </button>
              <button type="button" onclick="selectEngine('brave')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-white/5 hover:text-cyan-400 transition-colors">
                <i class="fa-solid fa-lion-head w-4 text-red-400"></i>
                <span>Brave</span>
              </button>
              <button type="button" onclick="selectEngine('ecosia')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-white/5 hover:text-cyan-400 transition-colors">
                <i class="fa-solid fa-tree w-4 text-emerald-400"></i>
                <span>Ecosia</span>
              </button>
            </div>
          </div>

          <!-- Browser Search Input -->
          <input 
            type="text" 
            id="browser-search-input" 
            placeholder="Search the web or type a URL..." 
            class="w-full bg-transparent text-white placeholder-gray-500 focus:outline-none text-base sm:text-lg px-2"
            autocomplete="off"
          />

          <!-- Clear Search Input Button -->
          <button 
            type="button" 
            id="clear-browser-input" 
            onclick="clearBrowserSearch()" 
            class="hidden text-gray-500 hover:text-white px-2 py-1 transition-colors"
          >
            <i class="fa-solid fa-xmark text-base"></i>
          </button>

          <!-- Submit / Search Button -->
          <button 
            type="submit" 
            class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white text-sm font-semibold shadow-lg shadow-cyan-500/10 transition-all duration-200 transform active:scale-95 ml-2 flex items-center space-x-2"
          >
            <i class="fa-solid fa-arrow-right"></i>
            <span class="hidden sm:inline">Search</span>
          </button>
        </form>

        <p class="text-xs text-gray-600 mt-4 tracking-wide">Press <kbd class="px-1.5 py-0.5 rounded bg-dark-card border border-dark-border text-gray-400 font-mono text-[10px]">ENTER</kbd> to launch web query</p>
      </div>
    </section>

    <!-- PAGE 2: GAMES -->
    <section id="page-games" class="page-view page-hidden flex-grow flex flex-col w-full px-4 sm:px-6 lg:px-8 py-8 max-w-7xl mx-auto">
      
      <!-- Games Header Bar -->
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-dark-border">
        <div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-white flex items-center">
            <i class="fa-solid fa-gamepad text-cyan-400 mr-3 text-2xl"></i> Game Arcade
          </h2>
          <p class="text-xs sm:text-sm text-gray-500 mt-1">Select and play directly inside your browser.</p>
        </div>

        <button onclick="switchTab('home')" class="px-4 py-2 rounded-xl bg-dark-card hover:bg-dark-border text-gray-400 hover:text-white text-xs font-semibold border border-dark-border transition-colors">
          <i class="fa-solid fa-house mr-1.5"></i> Home Screen
        </button>
      </div>

      <!-- Games Container (#games) -->
      <div id="games-wrapper" class="rounded-2xl overflow-hidden dark-glass border border-dark-border min-h-[600px] shadow-2xl relative flex flex-col">
        <div id="games" class="w-full h-full min-h-[600px] flex-grow"></div>

        <!-- Roblox-style Shift Lock Crosshair Overlay -->
        <div id="shift-lock-crosshair" class="absolute inset-0 items-center justify-center z-30 bg-black/10">
          <div class="w-4 h-4 rounded-full border border-cyan-400 flex items-center justify-center relative">
            <div class="w-1 h-1 bg-cyan-400 rounded-full"></div>
          </div>
        </div>

        <!-- Bottom Right Floating Toolbar for Fullscreen and Shift Lock -->
        <div class="absolute bottom-4 right-4 z-40 flex items-center space-x-2 bg-dark-base/90 p-1.5 rounded-xl border border-dark-border shadow-2xl backdrop-blur-md">
          <!-- Roblox Shift Lock Button -->
          <button 
            id="shift-lock-btn" 
            onclick="toggleShiftLock()" 
            class="flex items-center space-x-2 px-3 py-2 rounded-lg bg-dark-card hover:bg-dark-border text-xs font-semibold text-gray-300 transition-all border border-dark-border hover:text-cyan-400"
            title="Lock cursor inside screen (Roblox style)"
          >
            <i class="fa-solid fa-lock text-xs text-gray-400" id="shift-lock-icon"></i>
            <span id="shift-lock-label">Shift Lock</span>
            <span id="shift-lock-badge" class="px-1.5 py-0.5 text-[10px] rounded bg-gray-800 text-gray-400 font-mono">OFF</span>
          </button>

          <!-- Fullscreen Toggle Button -->
          <button 
            id="fullscreen-btn" 
            onclick="toggleFullscreen()" 
            class="flex items-center space-x-2 px-3 py-2 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 text-xs font-semibold text-cyan-400 transition-all border border-cyan-500/30"
            title="Open full screen"
          >
            <i class="fa-solid fa-expand text-xs" id="fullscreen-icon"></i>
            <span id="fullscreen-label">Fullscreen</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <footer class="relative z-10 w-full py-4 text-center text-xs text-gray-600 border-t border-dark-border/40 bg-dark-base/80">
    <p>&copy; 2026 CM Games. All dark rights reserved.</p>
  </footer>

  <!-- Script Container -->
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

  <script>
    /* State Management */
    let currentTab = 'home';
    let currentEngine = 'google';
    let luminInitialized = false;
    let isShiftLocked = false;

    const engines = {
      google: { name: 'Google', icon: 'fa-brands fa-google', url: 'https://www.google.com/search?q=' },
      duckduckgo: { name: 'DuckDuckGo', icon: 'fa-solid fa-shield-halved', url: 'https://duckduckgo.com/?q=' },
      bing: { name: 'Bing', icon: 'fa-brands fa-microsoft', url: 'https://www.bing.com/search?q=' },
      brave: { name: 'Brave', icon: 'fa-solid fa-lion-head', url: 'https://search.brave.com/search?q=' },
      ecosia: { name: 'Ecosia', icon: 'fa-solid fa-tree', url: 'https://www.ecosia.org/search?q=' }
    };

    /* Page Navigation Logic */
    function switchTab(tab) {
      if (tab === currentTab) return;
      currentTab = tab;

      const pageHome = document.getElementById('page-home');
      const pageGames = document.getElementById('page-games');
      const navHome = document.getElementById('nav-home');
      const navGames = document.getElementById('nav-games');

      if (tab === 'home') {
        pageGames.classList.add('page-hidden');
        pageHome.classList.remove('page-hidden');

        navHome.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-sm";
        navGames.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white hover:bg-white/5";
        
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }
      } else {
        pageHome.classList.add('page-hidden');
        pageGames.classList.remove('page-hidden');

        navGames.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-sm";
        navHome.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white hover:bg-white/5";

        initLuminSDK();
      }
    }

    function initLuminSDK() {
      if (!luminInitialized && window.Lumin) {
        try {
          Lumin.init({
            container: '#games',
            theme: 'dark'
          });
          luminInitialized = true;
        } catch (e) {
          console.log('Arcade initialization:', e);
        }
      }
    }

    /* Fullscreen Functionality */
    function toggleFullscreen() {
      const container = document.getElementById('games-wrapper');
      const fsIcon = document.getElementById('fullscreen-icon');
      const fsLabel = document.getElementById('fullscreen-label');

      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        } else if (container.msRequestFullscreen) {
          container.msRequestFullscreen();
        }
        fsIcon.className = "fa-solid fa-compress text-xs";
        fsLabel.textContent = "Exit Fullscreen";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        fsIcon.className = "fa-solid fa-expand text-xs";
        fsLabel.textContent = "Fullscreen";
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const fsIcon = document.getElementById('fullscreen-icon');
      const fsLabel = document.getElementById('fullscreen-label');
      if (!document.fullscreenElement) {
        fsIcon.className = "fa-solid fa-expand text-xs";
        fsLabel.textContent = "Fullscreen";
      }
    });

    /* Roblox Shift Lock (Pointer Lock) Functionality */
    function toggleShiftLock() {
      const container = document.getElementById('games-wrapper');
      
      if (document.pointerLockElement === container) {
        document.exitPointerLock();
      } else {
        container.requestPointerLock = container.requestPointerLock || container.mozRequestPointerLock;
        if (container.requestPointerLock) {
          container.requestPointerLock();
        }
      }
    }

    document.addEventListener('pointerlockchange', updateShiftLockUI);
    document.addEventListener('mozpointerlockchange', updateShiftLockUI);

    function updateShiftLockUI() {
      const container = document.getElementById('games-wrapper');
      const badge = document.getElementById('shift-lock-badge');
      const icon = document.getElementById('shift-lock-icon');
      const crosshair = document.getElementById('shift-lock-crosshair');

      if (document.pointerLockElement === container || document.mozPointerLockElement === container) {
        isShiftLocked = true;
        badge.textContent = "ON";
        badge.className = "px-1.5 py-0.5 text-[10px] rounded bg-cyan-500/20 text-cyan-400 font-mono font-bold";
        icon.className = "fa-solid fa-lock text-xs text-cyan-400";
        crosshair.classList.add('active');
      } else {
        isShiftLocked = false;
        badge.textContent = "OFF";
        badge.className = "px-1.5 py-0.5 text-[10px] rounded bg-gray-800 text-gray-400 font-mono";
        icon.className = "fa-solid fa-unlock text-xs text-gray-400";
        crosshair.classList.remove('active');
      }
    }

    /* Keyboard Shift key toggle listener */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Shift' && currentTab === 'games') {
        toggleShiftLock();
      }
    });

    /* Browser Search Bar Logic */
    function toggleEngineMenu() {
      const menu = document.getElementById('engine-menu');
      menu.classList.toggle('hidden');
    }

    function selectEngine(key) {
      currentEngine = key;
      const engine = engines[key];
      document.getElementById('engine-name').textContent = engine.name;
      document.getElementById('engine-icon').className = `${engine.icon} text-cyan-400 text-base`;
      document.getElementById('engine-menu').classList.add('hidden');
    }

    function handleBrowserSearch(e) {
      e.preventDefault();
      const input = document.getElementById('browser-search-input');
      const query = input.value.trim();
      if (!query) return;

      const isUrl = /^https?:\/\//i.test(query) || (query.includes('.') && !query.includes(' '));
      
      let targetUrl = '';
      if (isUrl) {
        targetUrl = query.startsWith('http') ? query : `https://${query}`;
      } else {
        targetUrl = `${engines[currentEngine].url}${encodeURIComponent(query)}`;
      }

      window.open(targetUrl, '_blank');
    }

    const searchInput = document.getElementById('browser-search-input');
    const clearBtn = document.getElementById('clear-browser-input');

    searchInput.addEventListener('input', () => {
      if (searchInput.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    });

    function clearBrowserSearch() {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      searchInput.focus();
    }

    document.addEventListener('click', (e) => {
      const engineBtn = document.getElementById('engine-btn');
      const engineMenu = document.getElementById('engine-menu');
      if (engineBtn && engineMenu && !engineBtn.contains(e.target) && !engineMenu.contains(e.target)) {
        engineMenu.classList.add('hidden');
      }
    });

    /* Custom Trailing Cursor */
    const cursorDot = document.getElementById('cursor-dot');
    const cursorRing = document.getElementById('cursor-ring');

    let mouseX = -100, mouseY = -100;
    let ringX = -100, ringY = -100;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.left = `${mouseX}px`;
      cursorDot.style.top = `${mouseY}px`;
    });

    function renderCursor() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = `${ringX}px`;
      cursorRing.style.top = `${ringY}px`;
      requestAnimationFrame(renderCursor);
    }
    requestAnimationFrame(renderCursor);

    const interactiveQuery = 'a, button, input, select, [onclick], .cursor-pointer';
    document.body.addEventListener('mouseover', (e) => {
      if (e.target.closest(interactiveQuery)) {
        document.body.classList.add('cursor-hover');
      }
    });

    document.body.addEventListener('mouseout', (e) => {
      if (e.target.closest(interactiveQuery)) {
        document.body.classList.remove('cursor-hover');
      }
    });

    /* Dynamic Interactive Dark Mesh Canvas Background */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let gridNodes = [];
    const spacing = 45;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createGrid();
    }

    function createGrid() {
      gridNodes = [];
      const cols = Math.ceil(width / spacing) + 1;
      const rows = Math.ceil(height / spacing) + 1;

      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          gridNodes.push({
            baseX: i * spacing,
            baseY: j * spacing,
            x: i * spacing,
            y: j * spacing,
            vx: 0,
            vy: 0
          });
        }
      }
    }

    let time = 0;
    function animateBackground() {
      ctx.clearRect(0, 0, width, height);
      time += 0.015;

      for (let i = 0; i < gridNodes.length; i++) {
        const node = gridNodes[i];
        
        const waveX = Math.sin(time + node.baseY * 0.01) * 3;
        const waveY = Math.cos(time + node.baseX * 0.01) * 3;

        const dx = mouseX - node.baseX;
        const dy = mouseY - node.baseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 180;

        if (dist < maxDist) {
          const force = (1 - dist / maxDist) * -25;
          const angle = Math.atan2(dy, dx);
          node.x = node.baseX + Math.cos(angle) * force + waveX;
          node.y = node.baseY + Math.sin(angle) * force + waveY;
        } else {
          node.x += (node.baseX + waveX - node.x) * 0.08;
          node.y += (node.baseY + waveY - node.y) * 0.08;
        }

        ctx.fillStyle = 'rgba(30, 30, 50, 0.4)';
        ctx.fillRect(node.x - 1, node.y - 1, 2, 2);
      }

      ctx.lineWidth = 0.5;
      for (let i = 0; i < gridNodes.length; i += 4) {
        const node = gridNodes[i];
        const dx = mouseX - node.x;
        const dy = mouseY - node.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 150) {
          ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 * (1 - dist / 150)})`;
          ctx.beginPath();
          ctx.moveTo(node.x, node.y);
          ctx.lineTo(mouseX, mouseY);
          ctx.stroke();
        }
      }

      requestAnimationFrame(animateBackground);
    }

    window.onload = function() {
      resizeCanvas();
      animateBackground();
      window.addEventListener('resize', resizeCanvas);
    };
  </script>
</body>
</html>
